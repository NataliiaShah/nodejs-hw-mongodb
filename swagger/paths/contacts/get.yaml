tags:
  - Contacts
summary: get all contacts
description: Retrieves a list of all contacts.
  Supports filtering by contact type, favorite status, and pagination.
  Useful for displaying a paginated table of contacts.
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: name
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: desc
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: personal
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - nextPage
                - previousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contacts.yaml'
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 33
                totalPages:
                  type: number
                  example: 15
                nextPage:
                  type: boolean
                  example: true
                previousPage:
                  type: boolean
                  example: false
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
